
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тэнхлүүн Карго</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --pink:#ed5a9b;
  --light-pink:#fff0f6;
  --black:#211820;
  --white:#fff;
  --gray:#777;
  --line:#f0dce6;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff9fc;
  color:var(--black);
}
header{
  display:none;
  height:68px;
  background:#fff;
  align-items:center;
  justify-content:space-between;
  padding:8px 5%;
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
}
.brand img{
  width:39px;
  height:39px;
  object-fit:contain;
}
.brand-name{
  font-size:16px;
  font-weight:800;
}
.brand-name span{color:var(--pink)}
.header-label{
  font-size:12px;
  color:var(--pink);
  font-weight:bold;
}
main{
  max-width:1050px;
  margin:auto;
  padding:28px 16px;
}
.hero{
  text-align:center;
  padding:55px 12px 25px;
}
.hero h1{
  font-size:30px;
  margin:0 0 12px;
}
.hero h1 span{color:var(--pink)}
.hero p{
  color:var(--gray);
  font-size:14px;
}
.panel{
  max-width:440px;
  margin:20px auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px #ed5a9b12;
}
.panel h2{text-align:center;margin-top:0}
input{
  width:100%;
  padding:15px;
  border:1px solid #e8d5df;
  border-radius:12px;
  font-size:16px;
  outline:none;
  margin:8px 0;
}
input:focus{border-color:var(--pink)}
button{
  border:0;
  cursor:pointer;
  border-radius:12px;
  padding:14px 18px;
  font-size:14px;
  font-weight:bold;
}
.primary{
  width:100%;
  background:var(--pink);
  color:#fff;
  margin-top:10px;
}
.primary:disabled{opacity:.6;cursor:wait}
.muted{
  color:var(--gray);
  font-size:13px;
  text-align:center;
}
.message{
  text-align:center;
  font-size:13px;
  margin-top:12px;
  color:#c62868;
}
#customerDashboard,#adminDashboard{display:none}
.dashboard-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.dashboard-head h2{
  margin:0 0 5px;
  font-size:23px;
}
.logout{
  background:var(--light-pink);
  color:#c52d75;
  padding:11px 16px;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:22px 0;
}
.tab{
  background:#fff;
  border:1px solid var(--line);
  color:var(--black);
  padding:13px 5px;
  border-radius:14px;
  font-size:12px;
}
.tab.active{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}
.count{
  display:block;
  font-size:21px;
  font-weight:800;
  margin-bottom:5px;
}
.parcel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  margin:12px 0;
}
.parcel-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.tracking{
  font-weight:800;
  color:var(--pink);
  font-size:16px;
  overflow-wrap:anywhere;
}
.status-pill{
  background:var(--light-pink);
  color:#c52d75;
  border-radius:30px;
  padding:6px 10px;
  font-size:11px;
  font-weight:bold;
}
.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}
.detail{
  background:#fff8fb;
  border-radius:10px;
  padding:11px;
  font-size:13px;
}
.detail small{
  display:block;
  color:var(--gray);
  margin-bottom:5px;
}
.empty{
  background:#fff;
  padding:35px 15px;
  border-radius:16px;
  text-align:center;
  color:var(--gray);
  border:1px solid var(--line);
}
.branch-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  margin-top:20px;
}
.branch-box h3{margin-top:0}
.branch-box a{color:var(--pink)}
footer{
  text-align:center;
  color:#999;
  padding:25px 15px;
  font-size:12px;
}
.hidden{display:none!important}
@media(max-width:600px){
  header{height:62px;padding:7px 14px}
  .brand img{width:34px;height:34px}
  .brand-name{font-size:14px}
  .header-label{font-size:11px}
  main{padding:20px 13px}
  .hero{padding:35px 10px 20px}
  .hero h1{font-size:25px}
  .panel{padding:20px}
  .tabs{gap:6px}
  .tab{font-size:11px;padding:12px 3px}
  .count{font-size:19px}
}
</style>
</head>

<body>

<!-- ЛОГО ЗӨВХӨН ХЭРЭГЛЭГЧ НЭВТЭРСНИЙ ДАРАА ХАРАГДАНА -->
<header id="customerHeader">
  <div class="brand">
    <img src="tk-logo.png" alt="TK лого">
    <div class="brand-name">ТЭНХЛҮҮН <span>КАРГО</span></div>
  </div>
  <div class="header-label">МИНИЙ АЧАА</div>
</header>

<main>

<!-- НЭВТРЭХИЙН ӨМНӨХ ХЭСЭГ -->
<section id="publicPage">
  <div class="hero">
    <h1>Таны ачаа <span>найдвартай</span></h1>
    <p>Тэнхлүүн Карго — таны ачааг хүргэнэ.</p>
  </div>

  <div class="panel">
    <h2>Ачаагаа шалгах</h2>
    <p class="muted">Бүртгэлтэй 8 оронтой утасны дугаараа оруулна уу.</p>

    <input
      id="customerPhone"
      type="tel"
      inputmode="numeric"
      maxlength="8"
      placeholder="Утасны дугаар"
      autocomplete="tel"
    >

    <button class="primary" id="customerLoginButton" onclick="customerLogin()">
      НЭВТРЭХ
    </button>

    <div id="customerMessage" class="message"></div>
  </div>
</section>

<!-- ХЭРЭГЛЭГЧ НЭВТЭРСНИЙ ДАРААХ ХЭСЭГ -->
<section id="customerDashboard">

  <div class="dashboard-head">
    <div>
      <h2>Миний ачаанууд</h2>
      <div class="muted" id="customerPhoneLabel"></div>
    </div>
    <button class="logout" onclick="customerLogout()">Гарах</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabEreen" onclick="showTab('ereen')">
      <span class="count" id="countEreen">0</span>
      Эрээнд ирсэн
    </button>

    <button class="tab" id="tabMongolia" onclick="showTab('mongolia')">
      <span class="count" id="countMongolia">0</span>
      Монголд ирсэн
    </button>

    <button class="tab" id="tabReceived" onclick="showTab('received')">
      <span class="count" id="countReceived">0</span>
      Хүлээж авсан
    </button>
  </div>

  <div id="parcelList"></div>
  <div class="branch-box" id="branchInfo"></div>

</section>

<!-- АДМИНЫ НЭВТРЭЛТ -->
<section id="adminLogin" class="panel hidden">
  <h2>Админы нэвтрэлт</h2>

  <input id="adminEmail" type="email" placeholder="Имэйл">
  <input id="adminPassword" type="password" placeholder="Нууц үг">

  <button class="primary" onclick="adminLogin()">НЭВТРЭХ</button>
  <div id="adminMessage" class="message"></div>
</section>

<section id="adminDashboard" class="panel">
  <div class="dashboard-head">
    <h2>Админ хэсэг</h2>
    <button class="logout" onclick="adminLogout()">Гарах</button>
  </div>
  <p>Админы эрхээр нэвтэрлээ.</p>
  <p class="muted">Ачааны удирдлагын хэсэг.</p>
</section>

</main>

<footer id="pageFooter">© Тэнхлүүн Карго</footer>

<script>
const SUPABASE_URL = "https://marlhculacividpbfddn.supabase.co";
const SUPABASE_KEY = "sb_publishable_13w76dxEXz7SWRAouotJvw_6Oceh9jh";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let customerParcels = [];
let currentPhone = "";

function cleanPhone(value){
  return String(value || "").replace(/\D/g,"");
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function showMessage(id,message){
  document.getElementById(id).textContent = message;
}

function classifyStatus(status){
  const s = String(status || "").toLowerCase().trim();

  if(
    s.includes("хүлээж ав") ||
    s.includes("хүлээн ав") ||
    s.includes("авсан") ||
    s.includes("delivered") ||
    s.includes("received") ||
    s.includes("picked")
  ){
    return "received";
  }

  if(
    s.includes("монгол") ||
    s.includes("mongol") ||
    s.includes("ub_arrived") ||
    s.includes("arrived_mn") ||
    s.includes("in_mongolia") ||
    s.includes("mn_warehouse")
  ){
    return "mongolia";
  }

  return "ereen";
}

function statusLabel(group){
  if(group === "received") return "Хүлээж авсан";
  if(group === "mongolia") return "Монголд ирсэн";
  return "Эрээнд ирсэн";
}

async function customerLogin(){
  const phone = cleanPhone(
    document.getElementById("customerPhone").value
  );

  if(phone.length !== 8){
    showMessage("customerMessage","8 оронтой утасны дугаараа оруулна уу.");
    return;
  }

  const btn = document.getElementById("customerLoginButton");
  btn.disabled = true;
  btn.textContent = "ШАЛГАЖ БАЙНА...";
  showMessage("customerMessage","");

  try{
    const {data,error} = await db.rpc(
      "get_customer_parcels_by_phone",
      {p_phone:phone}
    );

    if(error) throw error;

    if(!data || data.length === 0){
      showMessage("customerMessage","Энэ дугаарт бүртгэлтэй ачаа олдсонгүй.");
      return;
    }

    currentPhone = phone;
    customerParcels = data;

    openCustomerDashboard();

  }catch(error){
    console.error(error);
    showMessage(
      "customerMessage",
      "Мэдээлэл авахад алдаа гарлаа. Дахин оролдоно уу."
    );
  }finally{
    btn.disabled = false;
    btn.textContent = "НЭВТРЭХ";
  }
}

function openCustomerDashboard(){

  // Нэвтрэх хэсгийг нууж, хэрэглэгчийн хэсгийг харуулна
  document.getElementById("publicPage").style.display = "none";
  document.getElementById("pageFooter").style.display = "none";

  // TK ЛОГО НЭВТЭРСНИЙ ДАРАА Л ГАРНА
  document.getElementById("customerHeader").style.display = "flex";

  document.getElementById("customerDashboard").style.display = "block";

  document.getElementById("customerPhoneLabel").textContent =
    "Утас: " + currentPhone;

  const ereen = customerParcels.filter(
    p => classifyStatus(p.parcel_status) === "ereen"
  );

  const mongolia = customerParcels.filter(
    p => classifyStatus(p.parcel_status) === "mongolia"
  );

  const received = customerParcels.filter(
    p => classifyStatus(p.parcel_status) === "received"
  );

  document.getElementById("countEreen").textContent = ereen.length;
  document.getElementById("countMongolia").textContent = mongolia.length;
  document.getElementById("countReceived").textContent = received.length;

  const first = customerParcels.find(p =>
    p.branch_name ||
    p.branch_address ||
    p.branch_hours ||
    p.branch_location
  );

  const branchInfo = document.getElementById("branchInfo");

  if(first){
    branchInfo.innerHTML = `
      <h3>Холбогдох салбар</h3>
      <p><b>${escapeHTML(first.branch_name || "Салбар")}</b></p>
      <p>${escapeHTML(first.branch_address || "")}</p>
      <p>${escapeHTML(first.branch_hours || "")}</p>
      ${
        first.branch_location
        ? `<a href="${escapeHTML(first.branch_location)}"
             target="_blank" rel="noopener">Байршил харах</a>`
        : ""
      }
    `;
  }else{
    branchInfo.style.display = "none";
  }

  showTab("ereen");
}

function showTab(tab){

  const tabIds = {
    ereen:"tabEreen",
    mongolia:"tabMongolia",
    received:"tabReceived"
  };

  Object.keys(tabIds).forEach(name => {
    document.getElementById(tabIds[name])
      .classList.toggle("active",name === tab);
  });

  const parcels = customerParcels.filter(
    p => classifyStatus(p.parcel_status) === tab
  );

  const list = document.getElementById("parcelList");

  if(!parcels.length){
    list.innerHTML = `
      <div class="empty">
        Энэ хэсэгт одоогоор ачаа байхгүй байна.
      </div>
    `;
    return;
  }

  list.innerHTML = parcels.map(p => `
    <div class="parcel">
      <div class="parcel-top">
        <div class="tracking">
          ${escapeHTML(p.tracking_code || "Трак кодгүй")}
        </div>
        <span class="status-pill">${statusLabel(tab)}</span>
      </div>

      <div class="details">
        <div class="detail">
          <small>Ширхэг</small>
          <b>${escapeHTML(p.piece_number ?? 1)}</b>
        </div>

        <div class="detail">
          <small>Жин</small>
          <b>${escapeHTML(p.weight_kg ?? "-")} кг</b>
        </div>

        <div class="detail">
          <small>Эзлэхүүн</small>
          <b>${escapeHTML(p.volume_m3 ?? "-")} м³</b>
        </div>

        <div class="detail">
          <small>Төлбөр</small>
          <b>${escapeHTML(p.price_mnt ?? "-")} ₮</b>
        </div>
      </div>

      ${
        p.description
        ? `<p>${escapeHTML(p.description)}</p>`
        : ""
      }

      ${
        p.arrived_at
        ? `<p class="muted">Ирсэн огноо: ${
            escapeHTML(new Date(p.arrived_at).toLocaleDateString("mn-MN"))
          }</p>`
        : ""
      }
    </div>
  `).join("");
}

function customerLogout(){

  currentPhone = "";
  customerParcels = [];

  document.getElementById("customerDashboard").style.display = "none";

  // ГАРАХАД ЛОГО ДАХИН НУУГДАНА
  document.getElementById("customerHeader").style.display = "none";

  document.getElementById("publicPage").style.display = "block";
  document.getElementById("pageFooter").style.display = "block";

  document.getElementById("customerPhone").value = "";

  showMessage("customerMessage","");
}

async function adminLogin(){

  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;

  showMessage("adminMessage","Нэвтэрч байна...");

  const {data,error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showMessage("adminMessage","Имэйл эсвэл нууц үг буруу байна.");
    return;
  }

  const {data:profile,error:profileError} = await db
    .from("profiles")
    .select("role")
    .eq("id",data.user.id)
    .single();

  if(profileError || !profile || profile.role !== "admin"){
    await db.auth.signOut();
    showMessage("adminMessage","Админы эрхгүй хэрэглэгч байна.");
    return;
  }

  document.getElementById("publicPage").style.display = "none";
  document.getElementById("pageFooter").style.display = "none";
  document.getElementById("customerHeader").style.display = "none";
  document.getElementById("adminLogin").style.display = "none";
  document.getElementById("adminDashboard").style.display = "block";
}

async function adminLogout(){
  await db.auth.signOut();

  document.getElementById("adminDashboard").style.display = "none";
  document.getElementById("adminLogin").style.display = "block";
}

function trackCargo(){
  const code = document.getElementById("trackingInput")?.value.trim();

  if(!code){
    showMessage("trackingMessage","Трак кодоо оруулна уу.");
    return;
  }

  showMessage(
    "trackingMessage",
    "Ачаагаа утасны дугаараар нэвтэрч шалгана уу."
  );
}

// АДМИНЫ ТУСДАА ХУУДАС
if(location.hash === "#admin"){
  document.getElementById("publicPage").style.display = "none";
  document.getElementById("pageFooter").style.display = "none";
  document.getElementById("adminLogin").classList.remove("hidden");
}
</script>

</body>
</html>
