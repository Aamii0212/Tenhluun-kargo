<!DOCTYPE html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тэнхлүүн Карго · Ажилтан</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode"></script><style>
:root{--p:#ed168b;--bg:#fff7fb;--line:#f1dce8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px Arial;color:#211820}main{max-width:650px;margin:24px auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}h1{color:var(--p);font-size:23px}input{width:100%;padding:14px;border:1px solid #e8d5df;border-radius:12px;margin:8px 0;font-size:16px}button{border:0;border-radius:12px;padding:14px;background:var(--p);color:white;font-weight:bold;cursor:pointer;width:100%;margin:8px 0}.secondary{background:#fff0f7;color:#bd176c}.hidden{display:none!important}.msg{color:#bd176c;white-space:pre-wrap}.result{padding:14px;background:#fff7fb;border-radius:12px;margin-top:12px}#reader{position:fixed;inset:0;z-index:99999;width:100vw;height:100dvh;max-width:none;margin:0;border-radius:0;overflow:hidden;background:#090909;color:white;display:flex;flex-direction:column;justify-content:center;padding:16px}#reader .scan-head{position:absolute;top:env(safe-area-inset-top,12px);left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;color:white;font-size:18px;font-weight:bold}#reader .scan-close{width:auto;margin:0;background:#ed168b;padding:10px 16px;border-radius:12px}#reader video{max-height:75dvh;object-fit:cover}label{font-size:13px;color:#666}
</style></head><body><main><div class="card"><h1>📦 Тэнхлүүн Карго · Ажилтан</h1><p>Ачаа хайх, үнэ бүртгэх, хүлээлгэн өгөх</p></div>
<section id="login" class="card"><h2>Ажилтны нэвтрэлт</h2><input id="email" type="email" placeholder="Имэйл" onkeydown="if(event.key===\'Enter\')login()"><input id="pass" type="password" placeholder="Нууц үг" onkeydown="if(event.key===\'Enter\')login()"><button onclick="login()">НЭВТРЭХ</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="card hidden">
<button class="secondary" onclick="logout()">Гарах</button>
<div class="card" style="padding:14px;margin:12px 0"><label for="employeeBranchSelect">Ажиллах салбар</label><select id="employeeBranchSelect" onchange="selectEmployeeBranch(this.value)" style="width:100%;padding:14px;border:1px solid #e8d5df;border-radius:12px;font-size:16px;margin-top:8px"><option value="">Салбар сонгоно уу</option></select><div id="employeeBranchMsg" class="msg"></div></div>
<h2>📦 Ачаа бүртгэх / QR уншуулах</h2>
<label>Харилцагчийн утас</label><input id="customerPhone" inputmode="numeric" maxlength="8" placeholder="8 оронтой утас">
<label>Трак код</label><input id="code" placeholder="QR уншуулна эсвэл гараар бичнэ" onkeydown="if(event.key==='Enter')findParcel()">
<button class="secondary" onclick="startScanner()">📷 QR / БАРКОД УНШУУЛАХ</button><div id="reader" class="hidden"></div>
<button onclick="findParcel()">АЧАА ХАЙХ</button><div id="out"></div>
</section></main>
<script>
const db=window.supabase.createClient("https://marlhculacividpbfddn.supabase.co","sb_publishable_13w76dxEXz7SWRAouotJvw_6Oceh9jh");
let parcel=null,settings={kg_price:2500,m3_price:700},scanner=null,employeeUserId=null,employeeRole="",selectedEmployeeBranchId="";
async function startScanner(){const phone=document.getElementById("customerPhone").value.replace(/\D/g,"");if(phone.length!==8){document.getElementById("out").textContent="Эхлээд 8 оронтой утасны дугаар оруулна уу.";return}const box=document.getElementById("reader");box.classList.remove("hidden");if(!window.Html5Qrcode){box.textContent="Камер уншигч ачаалсангүй. Трак кодыг гараар оруулна уу.";return}if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}box.innerHTML='<div class="scan-head"><span>📷 Трак код уншуулах</span><button class="scan-close" onclick="stopScanner()">✕ Хаах</button></div>';scanner=new Html5Qrcode("reader");try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:Math.min(280,window.innerWidth-40),height:160}},async(text)=>{document.getElementById("code").value=text.trim();await stopScanner();document.getElementById("code").focus();document.getElementById("out").textContent="Трак код уншигдлаа ✓ Хайх товч дарна уу.";},()=>{});}catch(e){box.innerHTML="Камер нээх боломжгүй. Safari-д камерын зөвшөөрөл өгөөд HTTPS холбоосоор нээнэ үү.";}}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function login(){let m=document.getElementById("loginMsg"),email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;if(!email||!pass){m.textContent="Имэйл болон нууц үгээ оруулна уу.";return}m.textContent="Нэвтэрч байна...";try{const {data,error}=await db.auth.signInWithPassword({email,password:pass});if(error){m.textContent="Нэвтрэх алдаа: "+error.message;return}const {data:p,error:pe}=await db.from("profiles").select("role").eq("id",data.user.id).maybeSingle();if(pe||!["employee","admin"].includes(p?.role)){await db.auth.signOut();m.textContent=pe?"Эрхийн мэдээлэл шалгахад алдаа гарлаа.":"Ажилтны эрх олгогдоогүй (profiles.role = employee).";return}employeeUserId=data.user.id;employeeRole=p.role;document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await initEmployeeApp();document.getElementById("code").focus()}catch(e){m.textContent="Сүлжээний алдаа: "+(e?.message||"дахин оролдоно уу")}}
async function initEmployeeApp(){const {data:st}=await db.from("site_settings").select("kg_price,m3_price").eq("id",1).maybeSingle();if(st)settings=st;await loadEmployeeBranches()}
async function loadEmployeeBranches(){
 const select=document.getElementById("employeeBranchSelect"),msg=document.getElementById("employeeBranchMsg");
 select.innerHTML='<option value="">Салбар сонгоно уу</option>';msg.textContent="Салбарууд ачаалж байна...";
 let branches=[];
 if(employeeRole==="admin"){
  const {data,error}=await db.from("branches").select("id,name").order("name");
  if(error){msg.textContent="Салбар татах алдаа: "+error.message;return}
  branches=data||[];
 }else{
  const {data:access,error}=await db.from("employee_branch_access").select("branch_id").eq("employee_id",employeeUserId);
  if(error){msg.textContent="Салбарын эрх татах алдаа: "+error.message+" · Админ салбар оноосон эсэхийг шалгана уу.";return}
  const ids=(access||[]).map(x=>x.branch_id);
  if(ids.length){
   const {data,error:be}=await db.from("branches").select("id,name").in("id",ids).order("name");
   if(be){msg.textContent="Оноосон салбар татах алдаа: "+be.message;return}
   branches=data||[];
  }
 }
 select.innerHTML+='<option value="">Салбар сонгоно уу</option>'+branches.map(b=>'<option value="'+esc(b.id)+'">'+esc(b.name)+'</option>').join("");
 const saved=sessionStorage.getItem("tenhluun_employee_branch_"+(employeeUserId||""));
 if(saved&&branches.some(b=>String(b.id)===saved)){
  select.value=saved;selectedEmployeeBranchId=saved;
  msg.textContent="Сонгосон салбар: "+(branches.find(b=>String(b.id)===saved)?.name||"");
 }else{
  selectedEmployeeBranchId="";sessionStorage.removeItem("tenhluun_employee_branch_"+(employeeUserId||""));
  msg.textContent=branches.length?"Ачаа хайх, бүртгэхийн өмнө салбараа сонгоно уу.":"Танд оноосон салбар алга. Админтай холбогдоно уу.";
 }
}
function selectEmployeeBranch(id){if(!id){selectedEmployeeBranchId="";sessionStorage.removeItem("tenhluun_employee_branch_"+(employeeUserId||""));parcel=null;document.getElementById("out").textContent="Салбараа сонгоно уу.";document.getElementById("employeeBranchMsg").textContent="Салбар сонгоогүй.";return}selectedEmployeeBranchId=String(id);sessionStorage.setItem("tenhluun_employee_branch_"+(employeeUserId||""),selectedEmployeeBranchId);parcel=null;document.getElementById("out").textContent="Одоо сонгосон салбарын ачааг хайна.";document.getElementById("employeeBranchMsg").textContent="Салбар сонгогдлоо. Хайлт, үнэ, хүлээлгэн өгөх үйлдэл энэ салбарт хамаарна."}
async function stopScanner(){if(scanner){const active=scanner;scanner=null;try{await active.stop();await active.clear()}catch(e){}}document.getElementById("reader").classList.add("hidden");document.getElementById("reader").innerHTML=""}
async function logout(){if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}await db.auth.signOut();location.reload()}
async function findParcel(){if(!selectedEmployeeBranchId){document.getElementById("out").textContent="Эхлээд ажиллах салбараа сонгоно уу.";return}let phone=document.getElementById("customerPhone").value.replace(/\D/g,"");if(phone.length!==8){document.getElementById("out").textContent="8 оронтой утасны дугаар оруулна уу.";return}let c=document.getElementById("code").value.trim().toUpperCase(),o=document.getElementById("out");if(!c){o.textContent="Трак код оруулна уу";return}o.textContent="Хайж байна...";try{const {data,error}=await db.from("parcels").select("*").eq("branch_id",selectedEmployeeBranchId).ilike("tracking_code",c).limit(1).maybeSingle();if(error){o.textContent="Хайлт алдаа: "+error.message;return}if(!data){parcel=null;o.textContent="Ачаа олдсонгүй";return}parcel=data;render()}catch(e){o.textContent="Сүлжээний алдаа: "+(e?.message||"дахин оролдоно уу")}}
function parcelStatusLabel(s){if(s==="received")return "Хүлээлгэн өгсөн";if(s==="mongolia")return "Монголд ирсэн";if(s==="ereen")return "Эрээнд ирсэн";return esc(s||"Бүртгэлтэй")}
function render(){let o=document.getElementById("out");let locked=parcel.parcel_status==="received";o.innerHTML='<div class="card"><b>'+esc(parcel.tracking_code)+'</b><p>'+esc(parcel.description||"")+'</p><label>Жин (кг)</label><input id="kg" type="number" min="0" step=".01" value="'+(parcel.weight_kg||0)+'"><label>Эзлэхүүн (м³)</label><input id="m3" type="number" min="0" step=".001" value="'+(parcel.volume_m3||0)+'"><label>Үнэ (₮)</label><input id="price" type="number" min="0" value="'+(parcel.price_mnt||0)+'"><button class="secondary" onclick="calc()">Үнэ тооцоолох</button><button '+(locked?'disabled':'')+' onclick="savePrice()">Үнэ хадгалах</button><button '+(locked?'disabled':'')+' onclick="handover()">ХҮЛЭЭЛГЭН ӨГӨХ</button><div id="actionMsg" class="msg"></div></div>';calc()}
function calc(){const p=document.getElementById("price");if(p&&!p.value)p.value=parcel?.price_mnt||0}
async function savePrice(){const msg=document.getElementById("actionMsg"),kg=Number(document.getElementById("kg").value),m3=Number(document.getElementById("m3").value),price=Number(document.getElementById("price").value);if(!parcel||![kg,m3,price].every(Number.isFinite)||kg<0||m3<0||price<0){msg.textContent="Жин, эзлэхүүн, үнийг 0-ээс багагүй зөв оруулна уу";return}msg.textContent="Хадгалж байна...";const {error}=await db.from("parcels").update({weight_kg:kg,volume_m3:m3,price_mnt:price}).eq("id",parcel.id).eq("branch_id",selectedEmployeeBranchId);if(error){msg.textContent="Жин/эзлэхүүн/үнэ хадгалах алдаа: "+error.message;return}Object.assign(parcel,{weight_kg:kg,volume_m3:m3,price_mnt:price});msg.textContent="Жин, эзлэхүүн, үнэ хадгалагдлаа ✓"}
async function handover(){const msg=document.getElementById("actionMsg");if(!parcel||parcel.parcel_status==="received")return;const staff=prompt("Хүлээлгэн өгсөн ажилтны нэр:");if(!staff||!staff.trim())return;const method=prompt("Төлбөрийн хэлбэр:\n1 = Бэлэн\n2 = Шилжүүлэг","1");if(method!=="1"&&method!=="2"){msg.textContent="1 эсвэл 2 сонгоно уу";return}msg.textContent="Хүлээлгэн өгч байна...";const {data,error}=await db.from("parcels").update({parcel_status:"received",paid_at:new Date().toISOString(),payment_method:method==="1"?"cash":"transfer",received_by:staff.trim()}).eq("id",parcel.id).eq("branch_id",selectedEmployeeBranchId).neq("parcel_status","received").select("id").maybeSingle();if(error){msg.textContent="Хүлээлгэн өгөх алдаа: "+error.message;return}if(!data){msg.textContent="Энэ ачаа өмнө нь хүлээлгэн өгөгдсөн байна";return}parcel.parcel_status="received";render()}
async function restoreSession(){const {data}=await db.auth.getSession();if(!data.session)return;const {data:p,error}=await db.from("profiles").select("role").eq("id",data.session.user.id).maybeSingle();if(!error&&["employee","admin"].includes(p?.role)){employeeUserId=data.session.user.id;employeeRole=p.role;document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await initEmployeeApp();}}
restoreSession();
</script></body></html>
