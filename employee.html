<!DOCTYPE html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тэнхлүүн Карго · Ажилтан</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode"></script><style>
:root{--p:#ed168b;--bg:#fff7fb;--line:#f1dce8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px Arial;color:#211820}main{max-width:650px;margin:24px auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}h1{color:var(--p);font-size:23px}input{width:100%;padding:14px;border:1px solid #e8d5df;border-radius:12px;margin:8px 0;font-size:16px}button{border:0;border-radius:12px;padding:14px;background:var(--p);color:white;font-weight:bold;cursor:pointer;width:100%;margin:8px 0}.secondary{background:#fff0f7;color:#bd176c}.hidden{display:none!important}.msg{color:#bd176c;white-space:pre-wrap}.result{padding:14px;background:#fff7fb;border-radius:12px;margin-top:12px}#reader{width:100%;max-width:520px;margin:12px auto;border-radius:14px;overflow:hidden}label{font-size:13px;color:#666}
</style></head><body><main><div class="card"><h1>📦 Тэнхлүүн Карго · Ажилтан</h1><p>Ачаа хайх, үнэ бүртгэх, хүлээлгэн өгөх</p></div>
<section id="login" class="card"><h2>Ажилтны нэвтрэлт</h2><input id="email" type="email" placeholder="Имэйл" onkeydown="if(event.key===\'Enter\')login()"><input id="pass" type="password" placeholder="Нууц үг" onkeydown="if(event.key===\'Enter\')login()"><button onclick="login()">НЭВТРЭХ</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="card hidden">
<button class="secondary" onclick="logout()">Гарах</button>
<h2>📦 Ачаа бүртгэх / QR уншуулах</h2>
<label>Харилцагчийн утас</label><input id="customerPhone" inputmode="numeric" maxlength="8" placeholder="8 оронтой утас">
<label>Трак код</label><input id="code" placeholder="QR уншуулна эсвэл гараар бичнэ" onkeydown="if(event.key==='Enter')findParcel()">
<button class="secondary" onclick="startScanner()">📷 QR / БАРКОД УНШУУЛАХ</button><div id="reader" class="hidden"></div>
<button onclick="findParcel()">АЧАА ХАЙХ</button><div id="out"></div>
</section></main>
<script>
const db=window.supabase.createClient("https://marlhculacividpbfddn.supabase.co","sb_publishable_13w76dxEXz7SWRAouotJvw_6Oceh9jh");
let parcel=null,settings={kg_price:2500,m3_price:700},scanner=null;
async function startScanner(){const phone=document.getElementById("customerPhone").value.replace(/\D/g,"");if(phone.length!==8){document.getElementById("out").textContent="Эхлээд 8 оронтой утасны дугаар оруулна уу.";return}const box=document.getElementById("reader");box.classList.remove("hidden");if(!window.Html5Qrcode){box.textContent="Камер уншигч ачаалсангүй. Трак кодыг гараар оруулна уу.";return}if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}box.innerHTML="";scanner=new Html5Qrcode("reader");try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:150}},async(text)=>{document.getElementById("code").value=text;const active=scanner;scanner=null;try{await active.stop();await active.clear()}catch(e){}box.classList.add("hidden");findParcel()},()=>{});}catch(e){box.innerHTML="Камер нээх боломжгүй. Safari-д камерын зөвшөөрөл өгөөд HTTPS холбоосоор нээнэ үү.";}}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function login(){let m=document.getElementById("loginMsg"),email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;if(!email||!pass){m.textContent="Имэйл болон нууц үгээ оруулна уу.";return}m.textContent="Нэвтэрч байна...";try{const {data,error}=await db.auth.signInWithPassword({email,password:pass});if(error){m.textContent="Нэвтрэх алдаа: "+error.message;return}const {data:p,error:pe}=await db.from("profiles").select("role").eq("id",data.user.id).maybeSingle();if(pe||!["employee","admin"].includes(p?.role)){await db.auth.signOut();m.textContent=pe?"Эрхийн мэдээлэл шалгахад алдаа гарлаа.":"Ажилтны эрх олгогдоогүй (profiles.role = employee).";return}document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");const {data:st,error:se}=await db.from("site_settings").select("kg_price,m3_price").eq("id",1).maybeSingle();if(!se&&st)settings=st;document.getElementById("code").focus()}catch(e){m.textContent="Сүлжээний алдаа: "+(e?.message||"дахин оролдоно уу")}}
async function logout(){if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}await db.auth.signOut();location.reload()}
async function findParcel(){let phone=document.getElementById("customerPhone").value.replace(/\D/g,"");if(phone.length!==8){document.getElementById("out").textContent="8 оронтой утасны дугаар оруулна уу.";return}let c=document.getElementById("code").value.trim().toUpperCase(),o=document.getElementById("out");if(!c){o.textContent="Трак код оруулна уу";return}o.textContent="Хайж байна...";try{const {data,error}=await db.rpc("employee_parcel_lookup",{p_tracking:c,p_phone:phone});if(error){o.textContent="Хайлт алдаа: "+error.message;return}const found=Array.isArray(data)?data[0]:data;if(!found){parcel=null;o.textContent="Трак код эсвэл утас таарахгүй, ачаа олдсонгүй.";return}parcel=found;render()}catch(e){o.textContent="Сүлжээний алдаа: "+(e?.message||"дахин оролдоно уу")}}
function parcelStatusLabel(s){if(s==="received")return "Хүлээлгэн өгсөн";if(s==="mongolia")return "Монголд ирсэн";if(s==="ereen")return "Эрээнд ирсэн";return esc(s||"Бүртгэлтэй")}
function render(){let o=document.getElementById("out");let locked=parcel.parcel_status==="received";o.innerHTML='<div class="card"><b>'+esc(parcel.tracking_code)+'</b><p>'+esc(parcel.description||"")+'</p><label>Жин (кг)</label><input id="kg" type="number" min="0" step=".01" value="'+(parcel.weight_kg||0)+'"><label>Эзлэхүүн (м³)</label><input id="m3" type="number" min="0" step=".001" value="'+(parcel.volume_m3||0)+'"><label>Үнэ (₮)</label><input id="price" type="number" min="0" value="'+(parcel.price_mnt||0)+'"><button class="secondary" onclick="calc()">Үнэ тооцоолох</button><button '+(locked?'disabled':'')+' onclick="savePrice()">Үнэ хадгалах</button><button '+(locked?'disabled':'')+' onclick="handover()">ХҮЛЭЭЛГЭН ӨГӨХ</button><div id="actionMsg" class="msg"></div></div>';calc()}
function calc(){const p=document.getElementById("price");if(p&&!p.value)p.value=parcel?.price_mnt||0}
async function savePrice(){const msg=document.getElementById("actionMsg"),kg=Number(document.getElementById("kg").value),m3=Number(document.getElementById("m3").value),price=Number(document.getElementById("price").value);if(!parcel||parcel.paid_at||parcel.parcel_status==="received"){msg.textContent="Төлбөр баталгаажсан эсвэл хүлээлгэн өгсөн ачааны үнэ, жинг дахин засахгүй.";return}if(![kg,m3,price].every(Number.isFinite)||kg<0||m3<0||price<=0){msg.textContent="Жин, эзлэхүүн 0-ээс багагүй; үнэ 0-ээс их зөв тоо байна.";return}msg.textContent="Хадгалж байна...";const {data,error}=await db.from("parcels").update({weight_kg:kg,volume_m3:m3,price_mnt:price}).eq("id",parcel.id).is("paid_at",null).neq("parcel_status","received").select("id").maybeSingle();if(error){msg.textContent="Жин/эзлэхүүн/үнэ хадгалах алдаа: "+error.message;return}if(!data){msg.textContent="Ачааны төлөв өөрчлөгдсөн байна. Дахин хайж шалгана уу.";return}Object.assign(parcel,{weight_kg:kg,volume_m3:m3,price_mnt:price});msg.textContent="Жин, эзлэхүүн, үнэ хадгалагдлаа ✓"}
async function handover(){const msg=document.getElementById("actionMsg");if(!parcel||parcel.parcel_status==="received")return;const amount=Number(parcel.price_mnt||0);if(!Number.isFinite(amount)||amount<=0){msg.textContent="Хүлээлгэн өгөхийн өмнө ачааны үнийг 0-ээс дээш зөв оруулна уу.";return}if(!confirm(parcel.tracking_code+" — "+amount.toLocaleString()+"₮ төлбөрийг баталгаажуулж хүлээлгэн өгөх үү?"))return;const staff=prompt("Хүлээлгэн өгсөн ажилтны нэр:");if(!staff||!staff.trim())return;const method=parcel.paid_at?null:prompt("Төлбөрийн хэлбэр:\n1 = Бэлэн\n2 = Шилжүүлэг","1");if(!parcel.paid_at&&method!=="1"&&method!=="2"){msg.textContent="1 эсвэл 2 сонгоно уу";return}msg.textContent="Хүлээлгэн өгч байна...";const {data,error}=await db.from("parcels").update({parcel_status:"received",paid_at:parcel.paid_at||new Date().toISOString(),payment_method:parcel.paid_at?parcel.payment_method:(method==="1"?"cash":"transfer"),received_by:staff.trim()}).eq("id",parcel.id).is("paid_at",parcel.paid_at||null).neq("parcel_status","received").select("id").maybeSingle();if(error){msg.textContent="Хүлээлгэн өгөх алдаа: "+error.message;return}if(!data){msg.textContent="Энэ ачаа өмнө нь хүлээлгэн өгөгдсөн байна";return}parcel.parcel_status="received";render()}
async function restoreSession(){const {data}=await db.auth.getSession();if(!data.session)return;const {data:p,error}=await db.from("profiles").select("role").eq("id",data.session.user.id).maybeSingle();if(!error&&["employee","admin"].includes(p?.role)){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");const {data:st}=await db.from("site_settings").select("kg_price,m3_price").eq("id",1).maybeSingle();if(st)settings=st;}}
restoreSession();
</script></body></html>
