<!DOCTYPE html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тэнхлүүн Карго · Ажилтан</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode"></script><style>
:root{--p:#ed168b;--bg:#fff7fb;--line:#f1dce8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px Arial;color:#211820}main{max-width:650px;margin:24px auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}h1{color:var(--p);font-size:23px}input{width:100%;padding:14px;border:1px solid #e8d5df;border-radius:12px;margin:8px 0;font-size:16px}button{border:0;border-radius:12px;padding:14px;background:var(--p);color:white;font-weight:bold;cursor:pointer;width:100%;margin:8px 0}.secondary{background:#fff0f7;color:#bd176c}.hidden{display:none!important}.msg{color:#bd176c;white-space:pre-wrap}.result{padding:14px;background:#fff7fb;border-radius:12px;margin-top:12px}#reader{width:100%;max-width:520px;margin:12px auto;border-radius:14px;overflow:hidden}label{font-size:13px;color:#666}
</style></head><body><main><div class="card"><h1>📦 Тэнхлүүн Карго · Ажилтан</h1><p>Ачаа хайх, үнэ бүртгэх, хүлээлгэн өгөх</p></div>
<section id="login" class="card"><h2>Ажилтны нэвтрэлт</h2><input id="email" type="email" placeholder="Имэйл" onkeydown="if(event.key===\'Enter\')login()"><input id="pass" type="password" placeholder="Нууц үг" onkeydown="if(event.key===\'Enter\')login()"><button onclick="login()">НЭВТРЭХ</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="card hidden"><button class="secondary" onclick="logout()">Гарах</button><h2>Трак код хайх</h2><input id="code" placeholder="Трак код" onkeydown="if(event.key===\'Enter\')findParcel()"><button class="secondary" onclick="startScanner()">📷 КАМЕРААР БАРКОД УНШУУЛАХ</button><div id="reader" class="hidden"></div><button onclick="findParcel()">АЧАА ХАЙХ</button><div id="out"></div></section></main>
<script>
const db=window.supabase.createClient("https://marlhculacividpbfddn.supabase.co","sb_publishable_13w76dxEXz7SWRAouotJvw_6Oceh9jh");
let parcel=null,settings={kg_price:2500,m3_price:700},scanner=null;
async function startScanner(){const box=document.getElementById("reader");box.classList.remove("hidden");if(!window.Html5Qrcode){box.textContent="Камер уншигч ачаалсангүй. Трак кодыг гараар оруулна уу.";return}if(scanner){try{await scanner.stop()}catch(e){}}scanner=new Html5Qrcode("reader");try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:150}},async(text)=>{document.getElementById("code").value=text;await scanner.stop();box.classList.add("hidden");scanner=null;findParcel()},()=>{});}catch(e){box.innerHTML="Камер нээх боломжгүй. Safari-д камерын зөвшөөрөл өгөөд HTTPS холбоосоор нээнэ үү.";}}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function login(){let m=document.getElementById("loginMsg");m.textContent="Нэвтэрч байна...";
const {data,error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("pass").value});if(error){m.textContent=error.message;return}
const {data:p,error:pe}=await db.from("profiles").select("role").eq("id",data.user.id).maybeSingle();
if(pe||!["employee","admin"].includes(p?.role)){await db.auth.signOut();m.textContent="Ажилтны эрх олгогдоогүй (profiles.role = employee).";return}
document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
const {data:st}=await db.from("site_settings").select("kg_price,m3_price").eq("id",1).maybeSingle();if(st)settings=st;code.focus()}
async function logout(){await db.auth.signOut();location.reload()}
async function findParcel(){let c=document.getElementById("code").value.trim().toUpperCase(),o=document.getElementById("out");if(!c){o.textContent="Трак код оруулна уу";return}o.textContent="Хайж байна...";
const {data,error}=await db.from("parcels").select("*").ilike("tracking_code",c).limit(1).maybeSingle();if(error||!data){o.textContent=error?"Хайлт алдаа: "+error.message:"Ачаа олдсонгүй";return}parcel=data;render()}
function parcelStatusLabel(s){if(s==="received")return "Хүлээлгэн өгсөн";if(s==="mongolia")return "Монголд ирсэн";if(s==="ereen")return "Эрээнд ирсэн";return esc(s||"Бүртгэлтэй")}\nfunction render(){let o=document.getElementById("out");let locked=parcel.parcel_status==="received";o.innerHTML='<div class="result"><b>Трак: '+esc(parcel.tracking_code)+'</b><p>Төлөв: '+parcelStatusLabel(parcel.parcel_status)+'</p><label>Жин (кг)</label><input id="kg" type="number" min="0" step=".01" '+(locked?'readonly':'')+' oninput="calc()" value="'+(parcel.weight_kg||0)+'"><label>Эзлэхүүн (м³)</label><input id="m3" type="number" min="0" step=".001" '+(locked?'readonly':'')+' oninput="calc()" value="'+(parcel.volume_m3||0)+'"><label>Үнэ (₮)</label><input id="price" type="number" min="0" '+(locked?'readonly':'')+' value="'+(parcel.price_mnt||0)+'"><button class="secondary" onclick="calc()">Үнэ тооцоолох</button><button '+(locked?'disabled':'')+' onclick="savePrice()">Үнэ хадгалах</button><button '+(locked?'disabled':'')+' onclick="handover()">ХҮЛЭЭЛГЭН ӨГӨХ</button><div id="actionMsg" class="msg"></div></div>';calc()}
function calc(){let k=Number(document.getElementById("kg").value||0),v=Number(document.getElementById("m3").value||0);document.getElementById("price").value=Math.round(k*settings.kg_price+v*settings.m3_price*500)}
async function savePrice(){let k=Number(document.getElementById("kg").value),v=Number(document.getElementById("m3").value),p=Number(document.getElementById("price").value),msg=document.getElementById("actionMsg");if(parcel.parcel_status==="received"){msg.textContent="Хүлээлгэн өгсөн ачааны мэдээллийг өөрчлөх боломжгүй.";return}if(!Number.isFinite(k)||k<0||!Number.isFinite(v)||v<0||!Number.isFinite(p)||p<0){msg.textContent="Жин, эзлэхүүн, үнийг 0-ээс багагүй зөв тоогоор оруулна уу.";return}let {data:updated,error}=await db.from("parcels").update({weight_kg:k,volume_m3:v,price_mnt:p}).eq("id",parcel.id).neq("parcel_status","received").select("id").maybeSingle();msg.textContent=error?"Хадгалах алдаа: "+error.message:!updated?"Ачаа хүлээлгэн өгөгдсөн тул өөрчлөлт хадгалсангүй.":"Үнэ, жин хадгалагдлаа ✓";if(updated)parcel={...parcel,weight_kg:k,volume_m3:v,price_mnt:p}}
async function handover(){let msg=document.getElementById("actionMsg");if(parcel.parcel_status==="received"){msg.textContent="Энэ ачаа өмнө нь хүлээлгэн өгөгдсөн байна.";return}if(!confirm(parcel.tracking_code+" ачааг "+Number(parcel.price_mnt||0).toLocaleString()+"₮-өөр хүлээлгэн өгөх үү?"))return;let staff=prompt("Ажилтны нэр:");if(!staff?.trim())return;let method=prompt("Төлбөр: 1-Бэлэн, 2-Шилжүүлэг","1");if(!["1","2"].includes(method))return;let {data:updated,error}=await db.from("parcels").update({parcel_status:"received",paid_at:new Date().toISOString(),payment_method:method==="1"?"cash":"transfer",received_by:staff.trim()}).eq("id",parcel.id).neq("parcel_status","received").select("id").maybeSingle();msg.textContent=error?"Алдаа: "+error.message:!updated?"Ачаа шинэчлэгдсэнгүй. Эрх эсвэл төлөвийг шалгана уу.":"Хүлээлгэн өглөө ✓";if(updated){parcel.parcel_status="received";render()}}
async function restoreSession(){const {data}=await db.auth.getSession();if(!data.session)return;const {data:p,error}=await db.from("profiles").select("role").eq("id",data.session.user.id).maybeSingle();if(!error&&["employee","admin"].includes(p?.role)){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");const {data:st}=await db.from("site_settings").select("kg_price,m3_price").eq("id",1).maybeSingle();if(st)settings=st;}}
restoreSession();
</script></body></html>
